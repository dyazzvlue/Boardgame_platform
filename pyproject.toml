[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameplatform"
version = "0.1.0"
description = "泛用多人联机桌游平台框架"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95",
    "uvicorn[standard]>=0.20",
    "websockets>=10",
    "bcrypt>=4.0",
    "aiosqlite>=0.19",
    "click>=8.0",
    "python-multipart>=0.0.5",
    "pydantic>=2,<3",
    "markdown-it-py>=4,<5",
    "bleach>=6,<7",
]

[project.optional-dependencies]
manila = ["pygame>=2.0"]
test = ["httpx>=0.24,<0.25", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*"]
